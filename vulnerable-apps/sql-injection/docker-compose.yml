services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: bookstore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d bookstore"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://lab:lab@db:5432/bookstore
    depends_on:
      db:
        condition: service_healthy
